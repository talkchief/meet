# Internal relay for TalkChief Cowork Meetings room events (prosody module
# mod_talkchief_room_events). Reachable only on the compose network (no
# published port). Forwards to Cowork over the private network with Cowork's
# certificate verified, like the /j/ guest proxy in web/custom-meet.conf.
server {
    listen 80;
    server_name events;

    location = /talkchief/meetings/events {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass https://10.1.0.46/api/v4/talkchief/meetings/events;
        proxy_set_header Host cowork.talkchief.io;
        proxy_ssl_server_name on;
        proxy_ssl_name cowork.talkchief.io;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
