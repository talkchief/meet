# Internal relay for TalkChief Cowork Meetings room events (prosody module
# mod_talkchief_room_events). Reachable only on the compose network (no
# published port). Forwards to Cowork over the private network with Cowork's
# certificate verified, like the /j/ guest proxy in web/custom-meet.conf.
# Call diagnostics from meeting pages (web/custom-meet.conf /talkchief-diag):
# one JSON line per report in a file per day under /var/log/tcdiag (mounted
# from the host; scripts/install.sh deletes files older than 14 days). The
# reports carry no names or addresses, and the sender's address (used only
# for the rate limit) isn't written.
log_format tcdiag escape=json '{"at":"$time_iso8601","report":"$request_body"}';
map $time_iso8601 $tcdiag_day {
    "~^(?<day>\d{4}-\d{2}-\d{2})" $day;
    default unknown;
}
limit_req_zone $http_x_forwarded_for zone=tcdiag:10m rate=30r/m;
# Only accepted reports are written (not refused or rate-limited requests).
map $status $tcdiag_log {
    204 1;
    default 0;
}

server {
    listen 127.0.0.1:8081;
    access_log off;
    location / {
        return 204;
    }
}

server {
    listen 80;
    server_name events;
    # Must exist: nginx skips logs whose path has a variable otherwise.
    root /usr/share/nginx/html;

    location = /talkchief/meetings/events {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass https://10.1.0.46/api/v4/talkchief/meetings/events;
        proxy_set_header Host cowork.talkchief.io;
        proxy_ssl_server_name on;
        proxy_ssl_name cowork.talkchief.io;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /talkchief/diag {
        limit_except POST { deny all; }
        limit_req zone=tcdiag burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        # Kept in memory, so $request_body is set for the log line.
        client_body_buffer_size 32k;
        access_log /var/log/tcdiag/diag-$tcdiag_day.jsonl tcdiag if=$tcdiag_log;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        return 404;
    }
}
