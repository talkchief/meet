<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkChief Cowork</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --title:#0C243C; --text:#3f4350; --muted:#4e6275; --line:#d1dae1; --button:#0F93F3; --button-hover:#0b7fd3; --brand:#6D46DD; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; color:var(--text);
    background:#f4f6fa url("/images/talkchief-light-bg.jpg") center / cover no-repeat;
    display:flex; flex-direction:column;
  }
  header { display:flex; align-items:center; gap:9px; padding:22px 32px; }
  header img { width:30px; height:30px; }
  header span { font-weight:600; font-size:18px; color:var(--title); }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:440px; background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:40px 36px 32px; box-shadow:0 20px 32px rgba(30,50,92,.08); text-align:center; }
  .badge { width:56px; height:56px; margin:0 auto 20px; border-radius:16px; display:grid; place-items:center;
    background:rgba(109,70,221,.10); border:1px solid rgba(109,70,221,.25); }
  h1 { font-size:24px; line-height:1.3; margin:0 0 10px; font-weight:700; color:var(--title); letter-spacing:-.01em; }
  p { font-size:15px; line-height:1.6; color:var(--muted); margin:0 0 28px; }
  .room { display:inline-block; font-size:13px; color:var(--title); background:#f4f6fa; border:1px solid var(--line);
    padding:6px 12px; border-radius:999px; margin:-12px 0 24px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  a.btn { display:block; text-decoration:none; color:#fff; background:var(--button); padding:12px 18px; border-radius:6px;
    font-weight:600; font-size:15px; transition:background .15s ease; }
  a.btn:hover { background:var(--button-hover); }
  .foot { margin-top:22px; font-size:12.5px; color:var(--muted); }
</style>
</head>
<body>
  <header><img src="/images/talkchief-t.png" alt=""><span>Talkchief Cowork</span></header>
  <main>
  <div class="card">
    <div class="badge" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6D46DD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1>This meeting is for invited people</h1>
    <p>Join from TalkChief Cowork, or open the invitation link the host shared with you.</p>
    <div class="room" id="room" hidden></div>
    <a class="btn" href="https://cowork.talkchief.io/">Open TalkChief Cowork</a>
    <div class="foot">Have an invitation link? Open it again to join.</div>
  </div>
  </main>
  <script>
    try {
      var r = new URLSearchParams(location.search).get('room');
      if (r) { var el = document.getElementById('room'); el.textContent = decodeURIComponent(r).split('@')[0]; el.hidden = false; }
    } catch (e) {}
  </script>
</body>
</html>
