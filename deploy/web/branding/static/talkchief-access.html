<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkChief Cowork</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --title:#0C243C; --text:#3f4350; --muted:#4e6275; --line:#d1dae1; --button:#0F93F3; --button-hover:#0b7fd3; --brand:#6D46DD; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { height:100%; margin:0; }
  body {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; color:var(--text);
    background:#f4f6fa url("/images/talkchief-light-bg.jpg") center / cover no-repeat;
    display:flex; flex-direction:column;
  }
  header { display:flex; align-items:center; gap:9px; padding:22px 32px; }
  header img { width:30px; height:30px; }
  header span { font-weight:600; font-size:18px; color:var(--title); }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:440px; background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:40px 36px 32px; box-shadow:0 20px 32px rgba(30,50,92,.08); text-align:center; }
  .badge { width:56px; height:56px; margin:0 auto 20px; border-radius:16px; display:grid; place-items:center;
    background:rgba(109,70,221,.10); border:1px solid rgba(109,70,221,.25); }
  h1 { font-size:24px; line-height:1.3; margin:0 0 10px; font-weight:700; color:var(--title); letter-spacing:-.01em; }
  p { font-size:15px; line-height:1.6; color:var(--muted); margin:0 0 28px; }
  .room { display:inline-block; font-size:13px; color:var(--title); background:#f4f6fa; border:1px solid var(--line);
    padding:6px 12px; border-radius:999px; margin:-12px 0 24px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  a.btn { display:block; text-decoration:none; color:#fff; background:var(--button); padding:12px 18px; border-radius:6px;
    font-weight:600; font-size:15px; transition:background .15s ease; }
  a.btn:hover { background:var(--button-hover); }
  a.btn.secondary { margin-top:10px; background:#fff; color:var(--title); border:1px solid var(--line); }
  a.btn.secondary:hover { background:#f4f6fa; }
  .foot { margin-top:22px; font-size:12.5px; color:var(--muted); }
</style>
</head>
<body>
  <header><img src="/images/talkchief-t.png" alt=""><span>Talkchief Cowork</span></header>
  <main>
  <div class="card">
    <div class="badge" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6D46DD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="12.5" height="11" rx="2.5"/><path d="M15.5 10.5 21 7.5v9l-5.5-3"/></svg>
    </div>
    <h1>Join this meeting</h1>
    <p>Open it in the TalkChief Cowork app, or continue in your browser. Either way you join as yourself.</p>
    <a class="btn" id="open-app" href="https://cowork.talkchief.io/" hidden>Open in TalkChief Cowork</a>
    <a class="btn" id="join" href="https://cowork.talkchief.io/">Continue in browser</a>
    <div class="foot">Joining as a guest? Open the invitation link the host shared with you.</div>
  </div>
  </main>
  <script>
    try {
      var q = new URLSearchParams(location.search);
      var room = (q.get('room') || '').split('@')[0].toLowerCase();
      var tenant = (q.get('tenant') || '').toLowerCase();
      if (/^[a-z0-9-]+$/.test(room) && /^[a-z0-9-]+$/.test(tenant)) {
        // Members join through Cowork, which signs them in and sends them on
        // with their own access: in the browser, or in the desktop app.
        document.getElementById('join').href = 'https://cowork.talkchief.io/api/v4/talkchief/meetings/room/' + tenant + '/' + room;
        if (!/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)) {
          var app = document.getElementById('open-app');
          var join = document.getElementById('join');
          app.href = 'talkchief://cowork.talkchief.io/' + tenant + '/meetings/join/' + room;
          app.hidden = false;
          join.className = 'btn secondary';
          // Like Zoom: try the app once; both buttons stay for a second try.
          var key = 'tc-app-tried:' + tenant + '/' + room;
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            setTimeout(function () { window.location.href = app.href; }, 400);
          }
        }
      }
    } catch (e) {}
  </script>
</body>
</html>
