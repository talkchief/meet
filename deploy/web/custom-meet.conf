
# ---- TalkChief Cowork Meetings ----
# No stand-alone landing page: the meeting host's root belongs to Cowork.
location = / {
    return 302 https://cowork.talkchief.io/;
}

# "Invite people" in the meeting: people search and invitations go to Cowork,
# authorised by the member's meeting token (Authorization: Bearer). Only these
# two endpoints are reachable; cookies are never forwarded.
location ~ ^/talkchief-api/(people|invite)$ {
    limit_except GET POST { deny all; }
    client_max_body_size 64k;
    proxy_pass https://10.1.0.46/api/v4/talkchief/meetings/$1$is_args$args;
    proxy_set_header Host cowork.talkchief.io;
    proxy_ssl_server_name on;
    proxy_ssl_name cowork.talkchief.io;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

# Call diagnostics from the meeting page (talkchief-room.js): passed to the
# internal events nginx, which rate-limits them and keeps them for 14 days.
# The service name is resolved per request, so the web container starts even
# when events is down.
location = /talkchief-diag {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $tcdiag http://events/talkchief/diag;
    proxy_pass $tcdiag;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}

# Error reports from the meeting page (talkchief-sentry.js, Sentry tunnel).
# Forwarded only to the talkchief-meetings project; the envelope carries the
# public DSN, which Sentry checks. Cookies and the client address are not sent.
location = /talkchief-sentry {
    limit_except POST { deny all; }
    client_max_body_size 256k;
    resolver 127.0.0.11 valid=300s ipv6=off;
    set $tcsentry o4504000494174208.ingest.us.sentry.io;
    proxy_pass https://$tcsentry/api/4512351601491968/envelope/;
    proxy_set_header Host $tcsentry;
    proxy_ssl_server_name on;
    proxy_ssl_name $tcsentry;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

# Guest invitation links (https://meet.talkchief.io/j/<code>) are served by
# Cowork's core server (/api/v4/talkchief/meetings/guest/<code>; meetings are
# built into Cowork, not a plugin), reached over the private network with its own
# certificate. The guest's address goes first in X-Forwarded-For; Cowork's
# nginx appends ours.
location ^~ /j/ {
    limit_except GET POST { deny all; }
    client_max_body_size 4k;
    proxy_pass https://10.1.0.46/api/v4/talkchief/meetings/guest/;
    proxy_set_header Host cowork.talkchief.io;
    proxy_ssl_server_name on;
    proxy_ssl_name cowork.talkchief.io;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

# Android App Links: lets the Cowork app open meet.talkchief.io links tapped in other apps.
location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"io.talkchief.cowork","sha256_cert_fingerprints":["B3:28:7F:8F:FA:01:C9:6B:B9:14:09:54:F1:65:A9:CA:76:C0:9C:59:9C:4C:54:F1:25:35:31:B9:20:6C:35:25","03:34:93:E4:5E:CB:94:8C:00:E6:A8:A9:11:30:51:EC:A0:3E:E3:71:B0:35:6E:E6:32:F2:5F:05:BC:35:48:AC"]}}]';
}
