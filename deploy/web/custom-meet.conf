
# ---- TalkChief Cowork Meetings ----
# No stand-alone landing page: the meeting host's root belongs to Cowork.
location = / {
    return 302 https://cowork.talkchief.io/;
}

# "Invite people" in the meeting: people search and invitations go to Cowork,
# authorised by the member's meeting token (Authorization: Bearer). Only these
# two endpoints are reachable; cookies are never forwarded.
location ~ ^/talkchief-api/(people|invite)$ {
    limit_except GET POST { deny all; }
    client_max_body_size 64k;
    proxy_pass https://10.1.0.46/api/v4/talkchief/meetings/$1$is_args$args;
    proxy_set_header Host cowork.talkchief.io;
    proxy_ssl_server_name on;
    proxy_ssl_name cowork.talkchief.io;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

# Guest invitation links (https://meet.talkchief.io/j/<code>) are served by
# Cowork's core server (/api/v4/talkchief/meetings/guest/<code>; meetings are
# built into Cowork, not a plugin), reached over the private network with its own
# certificate. The guest's address goes first in X-Forwarded-For; Cowork's
# nginx appends ours.
location ^~ /j/ {
    limit_except GET POST { deny all; }
    client_max_body_size 4k;
    proxy_pass https://10.1.0.46/api/v4/talkchief/meetings/guest/;
    proxy_set_header Host cowork.talkchief.io;
    proxy_ssl_server_name on;
    proxy_ssl_name cowork.talkchief.io;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
