# Per-node JVB settings (HOCON), included at the end of the image's jvb.conf.
# join.sh installs this only when the node has none yet, so local tuning
# survives a re-join.
#
# Load (the stress_level Jicofo uses to pick the least-loaded bridge) is
# measured with the release default, "cpu-usage": the node's own CPU
# utilisation against a threshold. It is relative to each node's CPU, so a
# small node reports high stress at a lower load than the 12 vCPU main host,
# and mixed node sizes need no per-node tuning. Change the threshold only after
# a load test shows the node degrading before (or long after) stress reaches 1.
# Confirm the key names and defaults in jitsi-videobridge's reference.conf for
# the pinned release before uncommenting, for example:
#
# videobridge.load-management.load-measurements.cpu-usage.load-threshold = 0.8
# videobridge.load-management.load-measurements.cpu-usage.recovery-threshold = 0.65
#
# Do not set packet-rate thresholds: that measurement is not active unless
# videobridge.load-management.load-measurement is switched to "packet-rate".
