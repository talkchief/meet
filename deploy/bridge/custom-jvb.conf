# Per-node JVB settings (HOCON), included at the end of the image's jvb.conf.
# join.sh installs this only when the node has none yet, so local tuning
# survives a re-join.
#
# Jicofo sends new conferences to the least-stressed bridge, and stress is
# packet-rate based against a fixed threshold, so a small node reports the same
# stress as the 12 vCPU main host for the same load and overloads first. After
# a load test, lower the threshold on smaller nodes, for example:
#
# videobridge.load-management.load-measurements.packet-rate.load-threshold = 25000
# videobridge.load-management.load-measurements.packet-rate.recovery-threshold = 20000
