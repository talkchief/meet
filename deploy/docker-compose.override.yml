# TalkChief overrides on top of the pinned upstream docker-compose.yml.
services:
  web:
    image: talkchief/meet-web:${JITSI_IMAGE_VERSION}-tc1
    build:
      context: ./web
      args:
        DJM_TAG: ${JITSI_IMAGE_VERSION}

  # Internal-only key server for RS256 JWT verification (prosody fetches
  # http://asap/asap/<sha256(kid)>.pem). Only public keys live here.
  asap:
    image: nginx:1.27-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - ./asap:/usr/share/nginx/html/asap:ro
    networks:
      meet.jitsi:

  # Room events (mod_talkchief_room_events) to Cowork: an internal-only nginx
  # that forwards them over the private network with TLS verified.
  events:
    image: nginx:1.27-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - ./events/events.conf:/etc/nginx/conf.d/default.conf:ro
      - ./diag:/var/log/tcdiag
    networks:
      meet.jitsi:

  # Prosody signs room events with a key derived from the meeting signing key
  # (scripts/install.sh writes it to .env).
  prosody:
    environment:
      - TALKCHIEF_EVENTS_SECRET=${TALKCHIEF_EVENTS_SECRET:-}

  # TURN relay for clients behind restrictive NAT/firewalls. Ephemeral
  # credentials are issued by prosody from the shared TURN_CREDENTIALS secret.
  coturn:
    image: coturn/coturn:4.6
    restart: ${RESTART_POLICY:-unless-stopped}
    network_mode: host
    # Replace the image's default args, which add a second --external-ip.
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/certs:/etc/coturn/certs:ro

  # Errors and health checks to Sentry (project talkchief-meetings): follows
  # the meeting services' Docker logs (read-only) and checks each service every
  # minute (monitor/monitor.py). The DSN is the project's public key.
  monitor:
    image: talkchief/meet-monitor:4
    build:
      context: ./monitor
    restart: ${RESTART_POLICY:-unless-stopped}
    read_only: true
    environment:
      - SENTRY_DSN=${TALKCHIEF_SENTRY_DSN:-https://2e0b865328e61274abfdb555f7b33298@o4504000494174208.ingest.us.sentry.io/4512351601491968}
      - SENTRY_ENVIRONMENT=production
      - COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-talkchief-meet}
      - TURN_HOST=${JVB_ADVERTISE_IPS:-46.225.31.248}
    # Host network: jicofo and the bridge publish their status only on the
    # host's 127.0.0.1. The monitor listens on nothing.
    network_mode: host
    volumes:
      - /var/lib/docker/containers:/dockerlogs:ro
