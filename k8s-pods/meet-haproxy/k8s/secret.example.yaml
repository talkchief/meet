# EXAMPLE ONLY, never applied from Git and not in kustomization.yaml. The certificate for
# meet.talkchief.io (full chain) and its key, as a standard TLS Secret: from SOPS through Argo CD, or
# from cert-manager (DNS-01) if the owner adds it. HAProxy reads tls.crt as meet.pem and tls.key as
# meet.pem.key.
#   kubectl -n meet create secret tls meet-tls --cert=fullchain.pem --key=privkey.pem
apiVersion: v1
kind: Secret
metadata:
  name: meet-tls
  namespace: meet
type: kubernetes.io/tls
stringData:
  tls.crt: CHANGE_ME
  tls.key: CHANGE_ME
