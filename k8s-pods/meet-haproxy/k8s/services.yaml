# meet.talkchief.io (DNS only, as today) -> the cloud load balancer of this Service -> HAProxy.
# Provider-neutral: type LoadBalancer with TCP 443 and 80 passed through (TLS ends in HAProxy, which
# holds the certificate, Secret meet-tls) and externalTrafficPolicy Local, so only workers with an
# HAProxy pod receive clients. The provider overlay names and shapes the load balancer: on Hetzner
# k8s-pods/overlays/hetzner/meet-haproxy-lb.yaml (meet-lb, its health check on node port 30080);
# another provider's mapping is in k8s-pods/GCP-PORTING.md.
# - no stickiness: both HAProxy pods compute the same consistent hash over the same shard list and
#   share the peered stick table, so a room goes to the same shard whichever HAProxy pod or load
#   balancer target receives the connection (README).
apiVersion: v1
kind: Service
metadata:
  name: meet-haproxy
  labels:
    app.kubernetes.io/name: meet-haproxy
    app.kubernetes.io/part-of: meet
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: meet-haproxy
  ports:
    - {name: https, port: 443, targetPort: https, nodePort: 30443, protocol: TCP}
    - {name: http, port: 80, targetPort: http, nodePort: 30080, protocol: TCP}
---
# Peers: each HAProxy pod reaches the other by name (meet-haproxy-<n>.meet-haproxy-peers) on 8445.
# Addresses are published before a pod is ready, so the two pods find each other while starting.
apiVersion: v1
kind: Service
metadata:
  name: meet-haproxy-peers
  labels:
    app.kubernetes.io/name: meet-haproxy
    app.kubernetes.io/part-of: meet
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: meet-haproxy
  ports:
    - {name: peers, port: 8445, targetPort: peers, protocol: TCP}
