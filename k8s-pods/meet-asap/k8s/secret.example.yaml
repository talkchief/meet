# EXAMPLE ONLY, never applied from Git and not in kustomization.yaml (applied from SOPS by Argo CD).
# The key of each entry is the file name Prosody asks for: sha256 of the token's kid, hex, plus
# ".pem" (deploy/scripts/install.sh: KID=talkchief-cowork-1). The value is the PUBLIC key that
# matches Cowork's Secret meet-jwt (namespace cowork, key private.pem):
#   kid=talkchief-cowork-1; name=$(printf %s "$kid" | sha256sum | cut -d' ' -f1).pem
#   openssl pkey -in private.pem -pubout -out "$name"
#   kubectl -n meet create secret generic meet-jwt-public --from-file="$name"
apiVersion: v1
kind: Secret
metadata:
  name: meet-jwt-public
  namespace: meet
type: Opaque
stringData:
  CHANGE_ME-sha256-of-kid.pem: CHANGE_ME
