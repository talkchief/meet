# Only the shard pods (Prosody) read the keys; the key server reaches nothing (DNS aside, allowed
# for every pod by k8s-pods/meet-namespace/k8s/networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meet-asap
  labels:
    app.kubernetes.io/name: meet-asap
    app.kubernetes.io/part-of: meet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: meet-asap
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: meet-shard
      ports:
        - {protocol: TCP, port: 8080}
  # No egress rule: with Egress in policyTypes that allows no egress. Not written as `egress: []`, which the
  # API server drops, so Argo CD's server-side diff saw a change on every comparison (adoption diff, 2026-11-26).
