# Public-key server for RS256 meeting tokens (deploy/docker-compose.override.yml service "asap").
# Prosody fetches http://meet-asap.meet.svc.cluster.local:8080/asap/<sha256(kid)>.pem; the files come
# from the Secret meet-jwt-public. Only public keys live here; the signing key stays in Cowork.
server {
    listen 8080;
    access_log off;
    root /usr/share/nginx/html;

    location /asap/ {
        limit_except GET { deny all; }
        default_type application/x-pem-file;
    }

    location = /healthz {
        return 204;
    }

    location / {
        return 404;
    }
}
