# EXAMPLE ONLY, never applied from Git and not in kustomization.yaml (SOPS through Argo CD).
#   token           a Hetzner Cloud API token of the cowork project, read/write, used only here
#   cluster-config  base64 of the JSON in k8s-pods/cluster-autoscaler/README.md: the Talos image id and,
#                   per node group, the bridge nodes' Talos machine configuration (it holds the
#                   cluster's join secrets), labels and taint
apiVersion: v1
kind: Secret
metadata:
  name: cluster-autoscaler-hcloud
  namespace: kube-system
type: Opaque
stringData:
  token: CHANGE_ME
  cluster-config: CHANGE_ME
