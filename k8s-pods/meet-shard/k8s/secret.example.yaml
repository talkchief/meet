# EXAMPLE ONLY, never applied from Git and not in kustomization.yaml. Production values come from SOPS
# through Argo CD, each generated fresh when it moves (design 10.3), never copied from a host .env.
# Prosody of both shards, Jicofo and every video bridge share the two XMPP account passwords:
#   meet-jicofo-auth  Jicofo's account on both shards' Prosody (shard pods only)
#   meet-jvb-auth     the bridges' account on both shards' Prosody (shard pods and meet-jvb)
#   turn-meet         Meet's coturn secret (same Secret in namespace media; rotate first, gate G12)
#   meet-events       room-event signing key (same Secret in namespace cowork)
#   ghcr-pull         pull access to the private ghcr.io/talkchief/meet-web image
# for example: kubectl -n meet create secret generic meet-jvb-auth --from-literal=password="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: meet-jicofo-auth
  namespace: meet
type: Opaque
stringData:
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: meet-jvb-auth
  namespace: meet
type: Opaque
stringData:
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: turn-meet
  namespace: meet
type: Opaque
stringData:
  static-auth-secret: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: meet-events
  namespace: meet
type: Opaque
stringData:
  secret: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: meet
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"CHANGE_ME"}}}'
