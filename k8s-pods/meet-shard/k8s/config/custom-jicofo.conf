# Jicofo settings (HOCON), appended to the image's jicofo.conf by its start script (the init
# container copies this file into Jicofo's /config). Bridge selection (jicofo-selector reference.conf):
# - max-bridge-participants: also set by MAX_BRIDGE_PARTICIPANTS in shard.env. The cap is counted by
#   each Jicofo on its own, so with two shards a bridge can carry twice the value: 15 per shard keeps a
#   CPX22 bridge near the 30 participants it carried at stress 0.5 on the test cluster (2026-11-25);
# - max-bridge-participants-per-interval: at most 30 new participants per bridge per ramp-up
#   interval, so a burst of joins spreads over the bridges.
# The bridge relay (Octo) and its selection strategy come from the meet-relay ConfigMap
# (k8s-pods/meet-namespace/k8s/relay.env, switched off; the overlay toggles it).
jicofo.bridge.max-bridge-participants = 15
jicofo.bridge.max-bridge-participants-per-interval = 30
# Bridge health checks (L20, JvbDoctor): one health-check IQ per bridge every second instead of every 10 s,
# and the retry after a timeout 1 s later instead of 5 s. A timed-out check only stops new conferences on
# that bridge; what moves the running ones off a dead bridge is the bridge leaving the brewery room when
# Prosody drops its session. The check every second makes sure Prosody has an unanswered stanza on a dead
# bridge's connection within a second, so the shard pod's tcp_retries2 = 2 (deployment-shard-*.yaml) fails
# that connection 1.4-3 s later (test cluster 2026-11-25: frozen media 34-35 s as built).
jicofo.bridge.health-checks.interval = 1 second
jicofo.bridge.health-checks.retry-delay = 1 second
