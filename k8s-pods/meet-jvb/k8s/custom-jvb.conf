# Bridge settings (HOCON), appended to the image's jvb.conf (k8s-pods/meet-jvb). Starts from
# deploy/bridge/custom-jvb.conf; see there for the load measurement, which stays at the release
# default: load-management on "cpu-usage", whose CPU steal detection (detect-cpu-steal, default on)
# raises stress when a shared vCPU host steals time (design 5.8, alert JvbCpuSteal).
#
# Kubernetes: the bridge runs with host networking, so its REST servers would listen on the node's
# addresses. Both stay on loopback: the private one (8080: /colibri/stats, drain, shutdown,
# /about/health, /metrics) is used only inside the pod (probes, the sidecar), and the public one
# (colibri websockets) is not used, because the bridge channel runs over SCTP at this release
# (deploy/RUNBOOK-bridge-node.md). The sidecar serves /metrics alone on 9888.
videobridge.http-servers.private.host = 127.0.0.1
videobridge.http-servers.public.host = 127.0.0.1
