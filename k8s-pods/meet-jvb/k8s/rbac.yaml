# The sidecar's only API access: get, list and patch pods in namespace meet. List reads the other
# bridges' site annotations (the scale-in order, L18). RBAC cannot name "its own pod" (pod names are
# random), so admission-policy.yaml narrows every change to the caller's own pod and to the
# pod-deletion-cost and site annotations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meet-jvb
  labels:
    app.kubernetes.io/name: meet-jvb
    app.kubernetes.io/part-of: meet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meet-jvb-deletion-cost
  labels:
    app.kubernetes.io/name: meet-jvb
    app.kubernetes.io/part-of: meet
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meet-jvb-deletion-cost
  labels:
    app.kubernetes.io/name: meet-jvb
    app.kubernetes.io/part-of: meet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: meet-jvb-deletion-cost
subjects:
  - kind: ServiceAccount
    name: meet-jvb
    namespace: meet
