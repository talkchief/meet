# Kustomize base of the video bridges (k8s-pods/meet-jvb/README.md): the upstream jvb image at
# stable-11248-2 pinned by digest (cluster tooling exception), one per cowork-jvb node with host
# networking, a Python sidecar (upstream python image pinned by digest, script from a generated
# ConfigMap) and least-privilege access to its own pod. The KEDA ScaledObject is k8s-pods/meet-jvb/keda,
# composed by an overlay only once its Prometheus address is known.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: meet
resources:
  - rbac.yaml
  - admission-policy.yaml
  - deployment.yaml
configMapGenerator:
  - name: meet-jvb
    files:
      - jvb_sidecar.py
      - custom-jvb.conf
