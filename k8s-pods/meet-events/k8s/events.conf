# Kubernetes variant of deploy/events/events.conf (k8s-pods/meet-events/README.md). Room events from
# Prosody (mod_talkchief_room_events) go to Cowork's in-cluster Service
# cowork-app.cowork.svc.cluster.local:8065 with Host cowork.talkchief.io, instead of
# https://10.1.0.46 over the private network. Call diagnostics from meeting pages are written as one
# JSON line per accepted report to stdout (collected by Alloy into Loki) instead of a file per day
# on the host. The listener moves to 8080 because the image runs without root.
log_format tcdiag escape=json '{"tcdiag":1,"at":"$time_iso8601","report":"$request_body"}';
limit_req_zone $http_x_forwarded_for zone=tcdiag:10m rate=30r/m;
# Only accepted reports are written (not refused or rate-limited requests).
map $status $tcdiag_log {
    204 1;
    default 0;
}

server {
    listen 127.0.0.1:8081;
    access_log off;
    location / {
        return 204;
    }
}

server {
    listen 8080;
    server_name events;
    access_log off;
    root /usr/share/nginx/html;

    location = /talkchief/meetings/events {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
        set $tccowork cowork-app.cowork.svc.cluster.local:8065;
        proxy_pass http://$tccowork/api/v4/talkchief/meetings/events;
        proxy_set_header Host cowork.talkchief.io;
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /talkchief/diag {
        limit_except POST { deny all; }
        limit_req zone=tcdiag burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        # Kept in memory, so $request_body is set for the log line.
        client_body_buffer_size 32k;
        access_log /dev/stdout tcdiag if=$tcdiag_log;
        proxy_pass http://127.0.0.1:8081;
    }

    # Probes (kubelet) only.
    location = /healthz {
        return 204;
    }

    location / {
        return 404;
    }
}
