# Overlay of the cowork cluster (design: kz5 doc/collaboration_cluster_architecture.md): every Meet
# base in apply order, plus the Hetzner component (k8s-pods/overlays/hetzner: the meet-lb load
# balancer and the Cluster Autoscaler). Argo CD of the cowork cluster applies it (Application meet-zone1,
# in talkchief_cowork pods/overlays/hetzner/cluster/argocd); nothing here is applied by hand. Another provider swaps that one component (k8s-pods/GCP-PORTING.md).
#
# zone1 production values (2026-11-26): cowork-meet-lb's Primary IPs and private address (zone1-lb.yaml), the
# autoscaler off with fixed bridges (zone1-autoscaler-off.yaml; its network CT-Network1 and firewall
# cowork-bridge-fw set for when it is turned on), and meet-web by digest.
# KEDA is NOT composed yet (scripts/test-k8s-pods.py lists it as a known gap): its Prometheus, the shared
# Prometheus of the voip cluster reachable from this cluster (URL and, if it needs one, a KEDA
# TriggerAuthentication), is not known until that endpoint is exposed. Argo CD applies this overlay with
# auto-sync (Application meet-zone1), so the ScaledObject is left out of the render, not merely unapplied:
# the bridges run the JVB Deployment's own replicas (2). To turn it on, add ../../meet-jvb/keda to
# resources and a patch setting both triggers' serverAddress (and add an ignoreDifferences entry for
# Deployment meet-jvb /spec/replicas to the Application, since KEDA's HPA then owns that field).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../meet-namespace/k8s
  - ../../meet-asap/k8s
  - ../../meet-events/k8s
  - ../../meet-shard/k8s
  - ../../meet-haproxy/k8s
  - ../../meet-jvb/k8s
components:
  - ../hetzner
# Bridge relay (Octo) toggle for this cluster: "false" (off, a meeting lives on one bridge). The test
# cluster's overlay sets "true" for the large-meeting test (k8s-pods/meet-namespace/k8s/relay.env).
configMapGenerator:
  - name: meet-relay
    namespace: meet
    behavior: merge
    literals:
      - ENABLE_OCTO=false
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cluster-autoscaler
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: CT-Network1
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: cowork-bridge-fw
  - path: zone1-lb.yaml
  - path: zone1-autoscaler-off.yaml
images:
  # talkchief/meet a6ade10e426d (talkchief with Meet #22 and #23), k8s-pods/meet-web/image, pushed 2026-11-26.
  # Named as the base already renamed it (meet-shard: meet-web -> ghcr.io/talkchief/meet-web).
  - name: ghcr.io/talkchief/meet-web
    newTag: "a6ade10e426d"
    digest: sha256:975e156f4dcd4e6838190e40c418a3d2265876d301f985add9092e5daee8f2b7
